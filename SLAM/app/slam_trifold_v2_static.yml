# Portable TriFold-3D v2 static-topology SLAM replay.
phase1:
  - cmd: "$BENCHMARK_ROOT/bin/slam_gpu"
    args: ["0", "0"]
    log: "gpgpusim.slam.log"
    is_to_stdout: false
    clock_rate: 1
  - cmd: "$SIMULATOR_ROOT/snipersim/run-sniper"
    args: ["--", "$BENCHMARK_ROOT/bin/slam_cpu", "5", "5"]
    log: "sniper.slam.log"
    is_to_stdout: false
    clock_rate: 1
  - cmd: "$BENCHMARK_ROOT/bin/slam_npu"
    args: ["0", "3"]
    log: "npu.slam.log"
    is_to_stdout: false
    clock_rate: 1

phase2:
  - cmd: "$SIMULATOR_ROOT/popnet_chiplet/build/popnet"
    args: ["-A", "36", "-c", "1", "-V", "3", "-B", "12", "-O", "12", "-F", "4", "-L", "1000", "-T", "1000000000", "-r", "1", "-I", "../bench.txt", "-R", "4", "-G", "../target_architecture_v2/trifold_v2_baseline.gv", "-D", "../delayInfo.txt", "-P"]
    log: "popnet.slam.log"
    is_to_stdout: false
    clock_rate: 1

bench_file: "./bench.txt"
delayinfo_file: "./delayInfo.txt"
